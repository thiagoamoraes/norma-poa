# Coleta diária do acervo normativo (SAPL da PGM): novidades, catálogo,
# vínculos e textos. Script determinístico — sem IA. Ver PLANO.md, fase 7.
#
# Etiqueta: 1 requisição por minuto, sequencial (ingestao/sapl-io.mjs).
#
# Orçamento: repositório PRIVADO tem cota mensal de minutos do GitHub Actions
# (2.000 no plano gratuito) → 55 min/noite. Repositório PÚBLICO não tem cota →
# 320 min/noite. A escolha é automática, pela visibilidade do repositório; a
# variável de repositório MINUTOS_POR_NOITE (Settings → Secrets and variables →
# Actions → Variables), se existir, prevalece.
name: Coleta diária

on:
  schedule:
    - cron: '17 4 * * *'   # 01:17 em Porto Alegre, fora do expediente
  workflow_dispatch:
    inputs:
      minutos:
        description: 'Duração desta execução, em minutos (vazio = padrão)'
        required: false
      etapas:
        description: 'Etapas (novidades dopa catalogo vinculos textos)'
        required: false
        default: 'novidades dopa catalogo vinculos textos'
      max_arquivos:
        description: 'Limite de arquivos de texto (vazio = sem limite)'
        required: false
      parar_em_utc:
        description: 'Parar de coletar às HH:MM UTC, só neste dia (07:00 de Brasília = 10:00). Vazio = sem limite'
        required: false

permissions:
  contents: write

concurrency:
  group: coleta-sapl
  cancel-in-progress: false

jobs:
  # Guarda de horário (ingestao/guarda-horario.sh): o agendamento do GitHub chega
  # a atrasar horas; uma execução AGENDADA que acorda fora da madrugada de
  # Brasília (00:00–07:00 = 03:00–10:00 UTC) não coleta, nem se o disparo externo
  # já rodou. Disparo manual/externo é livre. Job pulado aparece cinza, sem e-mail.
  guarda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pular: ${{ steps.g.outputs.pular }}
      parar: ${{ steps.g.outputs.parar }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          desde=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          EXECUCOES_HOJE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/coleta-diaria.yml/runs?event=workflow_dispatch&created=>=${desde}&per_page=50" --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .conclusion != \"cancelled\")] | length") || EXECUCOES_HOJE=0
          export EXECUCOES_HOJE
          r=$(bash ingestao/guarda-horario.sh)
          echo "guarda: $r"
          case "$r" in
            pular*) echo "pular=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "pular=false" >> "$GITHUB_OUTPUT"; echo "parar=${r#seguir}" | tr -d ' ' | sed 's/^parar=/parar=/' >> "$GITHUB_OUTPUT" ;;
          esac

  coleta:
    needs: guarda
    if: ${{ always() && needs.guarda.outputs.pular != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MINUTOS: ${{ inputs.minutos || vars.MINUTOS_POR_NOITE }}
      ETAPAS: ${{ inputs.etapas || 'novidades dopa catalogo vinculos textos' }}
      MAX_ARQUIVOS: ${{ inputs.max_arquivos }}
      PARAR_EM_UTC: ${{ inputs.parar_em_utc || needs.guarda.outputs.parar }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar pdftotext e OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-por
      - name: Dependências (pdfjs-dist, usado na leitura dos cadernos do DOPA)
        run: npm ci --no-audit --no-fund
      - name: Testes da ingestão (sem rede)
        run: bash teste_parar_em.sh && bash teste_guarda_horario.sh && node teste_catalogo_sapl.mjs && node teste_textos_sapl.mjs && node teste_estrutura.mjs && node teste_versionamento.mjs && node teste_historico.mjs && node teste_minuta.mjs && node teste_leis_ordinarias.mjs && node teste_situacao.mjs && node teste_rede_local.mjs && node teste_ocr.mjs
      - name: Rotina de coleta
        id: rotina
        run: |
          if [ -z "$MINUTOS" ]; then
            if [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" = "false" ]; then MINUTOS=320; else MINUTOS=55; fi
          fi
          echo "duração desta execução: ${MINUTOS} min"
          export MINUTOS
          bash ingestao/rotina.sh
        continue-on-error: true
      - name: Gravar no repositório
        id: gravar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados docs
          if git diff --cached --quiet; then echo "nada a gravar"; exit 0; fi
          git commit -q -m "Coleta diária — $(date -u +%F)"
          # Se alguém enviou commit durante a coleta, os arquivos GERADOS (catálogo
          # da página, relatórios) entram em conflito — aconteceu em 17/11/2026 e a
          # execução perdeu o que tinha coletado. Na dúvida vale a versão desta
          # coleta ("-X theirs", num rebase, é o commit que está sendo reaplicado):
          # os dados coletados só existem aqui, e o que é gerado se refaz na
          # execução seguinte. Três tentativas, para o caso de corrida no envio.
          for tentativa in 1 2 3; do
            if git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "gravado (tentativa ${tentativa})"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "não foi possível gravar no repositório depois de 3 tentativas"; exit 1
      - name: Seguro - guardar os dados como artefato se a gravação falhar
        # Se o envio ao repositório falhar, o que a coleta produziu não se perde:
        # fica 30 dias em Actions → a execução → Artifacts. Para restaurar,
        # descompacte na raiz do repositório e faça o commit (ROTEIRO.md, 10-A).
        if: always() && steps.gravar.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dados-nao-gravados-${{ github.run_id }}
          path: |
            dados
            docs/dados
            !dados/_bruto
          retention-days: 30
      - name: Guardar arquivos brutos na Release "textos-brutos"
        if: always()
        run: |
          if [ -z "$(ls -A dados/_bruto/sapl 2>/dev/null)" ]; then echo "nenhum arquivo bruto nesta execução"; exit 0; fi
          pacote="bruto-$(date -u +%F)-${GITHUB_RUN_ID}.tar.gz"
          tar -czf "$pacote" -C dados/_bruto sapl
          gh release view textos-brutos >/dev/null 2>&1 || gh release create textos-brutos --title "Arquivos brutos das normas (SAPL da PGM)" --notes "Arquivos originais baixados pela coleta diária, um pacote por execução. O hash de cada arquivo está em dados/textos/sapl/_indice.jsonl."
          gh release upload textos-brutos "$pacote"
      - name: Falhar se alguma etapa falhou
        if: steps.rotina.outcome == 'failure'
        run: |
          echo "Alguma etapa da rotina terminou com erro — ver o log da etapa 'Rotina de coleta'."
          exit 1
